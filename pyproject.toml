[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-scm", "wheel" ]

[project]
name = "flit-gettext"
readme = "README.md"
keywords = [ "build", "flit", "gettext", "packaging", "pep518" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [ "description", "version" ]
dependencies = [
  "flit-core>=3.12,<5",
]
optional-dependencies.scm = [
  "flit-scm",
]
urls.Changelog = "https://github.com/codingjoe/flit-gettext/releases"
urls.Project-URL = "https://github.com/codingjoe/flit-gettext"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "build",
  "flit-scm",
  "pip",
  "pytest",
  "pytest-cov",
  "wheel",
]

[tool.setuptools_scm]
write_to = "flit_gettext/_version.py"

[tool.flit]
module.name = "flit_gettext"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "flit_gettext", "tests" ]
format.preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "EXE", # flake8-executable
  "F",   # pyflakes
  "I",   # isort
  "PGH", # pygrep-hooks
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [ "D1" ]
lint.per-file-ignores."*/migrations/*.py" = [ "E501" ]
lint.per-file-ignores."*/test*.py" = [ "PLR2004", "S101" ]
lint.flake8-pytest-style.fixture-parentheses = false
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "flit_gettext", "tests" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.isort]
atomic = true
line_length = 88
include_trailing_comma = true
combine_as_imports = true
default_section = "THIRDPARTY"
known_first_party = "flit_gettext, tests"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --tb=short -rxs"

[tool.coverage]
run.source = [ "flit_gettext" ]
run.omit = [ "flit_gettext/_version.py" ]
report.show_missing = true

[tool.pydocstyle]
add_ignore = "D1"
